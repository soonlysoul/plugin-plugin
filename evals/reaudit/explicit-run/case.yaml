schema_version: "1.0"
name: reaudit-explicit-run
description: Invocation explicite du ré-audit ; l'outil tourne et son verdict est rapporté tel quel.
tags: [reaudit, positive]
runs: 3
expected_outcome: Le skill lance pp.sh reaudit et rapporte « rien à revérifier depuis la version X », ou la liste des faits à revérifier.
execution:
  prompt: "/plugin-plugin:reaudit"
  max_turns: 10
  allowed_tools: [Skill, Read, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reaudit"'
  - name: ran-the-tool
    type: tool_used
    tool: Bash
    input_match: 'pp\.sh(\\")? reaudit'
  - name: reports-the-verdict
    type: regex
    target: last_message
    pattern: 'rien à revérifier depuis la version [0-9]+\.[0-9]+\.[0-9]+|faits à revérifier : [0-9]+'
