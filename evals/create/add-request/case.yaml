{
  "schema_version": "1.0",
  "name": "create-not-for-components",
  "description": "Ajouter un composant à un plugin existant n'est pas une création.",
  "tags": [
    "create",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill create n'est pas invoqué et aucun plugin n'est créé.",
  "execution": {
    "prompt": "Ajoute un agent de relecture à mon plugin plugin-notes existant.",
    "max_turns": 6,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?create\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "no-creation-report",
      "type": "regex",
      "target": "last_message",
      "pattern": "suite du plugin créé",
      "match": "not_contains"
    }
  ]
}
