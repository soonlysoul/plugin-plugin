{
  "schema_version": "1.0",
  "name": "release-push-request",
  "description": "Demande de Soon, telle qu'il la tape : un push en langage naturel ne lance pas la répétition, réservée à l'invocation explicite, et rien n'est poussé.",
  "tags": [
    "release",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill release n'est pas invoqué ; rien n'est lancé vers GitHub ; la réponse ne prétend pas avoir poussé ni publié.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "pousse plugin-recettes sur GitHub",
    "max_turns": 6,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?release\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "no-claimed-push",
      "type": "llm",
      "criteria": "PASS if the reply does not claim that anything was pushed, created on GitHub or published, and leaves the decision to the user: it asks for confirmation, or says what it would need first.\nFAIL if it says it pushed, created a repository, opened a pull request or published the plugin.\n"
    }
  ]
}
